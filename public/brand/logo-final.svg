<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 800">
  <title>Модуль Эстет — кухни на заказ</title>
  <!-- ===== Золотой знак: рама с надрезами + угловатая «М» ===== -->
  <g fill="none" stroke="#B99358" stroke-width="16">
    <path d="M148 536 V198 H420"/>
    <path d="M462 196 V292"/>
    <path d="M252 490 V536 H462 V312"/>
  </g>
  <g fill="#B99358">
    <path d="M204 204 L240 204 L322 446 L286 446 Z"/>
    <path d="M362 204 L402 204 L320 446 L284 446 Z"/>
    <rect x="366" y="204" width="36" height="154"/>
  </g>

  <!-- ===== Кухня тонкой линией ===== -->
  <!-- Навесные шкафы -->
  <rect x="517" y="190" width="516" height="108" fill="none" stroke="#1A1A1A" stroke-width="4"/>
  <line x1="687" y1="190" x2="687" y2="298" stroke="#1A1A1A" stroke-width="3.5"/>
  <line x1="861" y1="190" x2="861" y2="298" stroke="#1A1A1A" stroke-width="3.5"/>
  <g stroke="#B99358" stroke-width="5" stroke-linecap="round">
    <line x1="600" y1="224" x2="600" y2="264"/>
    <line x1="774" y1="224" x2="774" y2="264"/>
    <line x1="948" y1="224" x2="948" y2="264"/>
  </g>
  <!-- Подсветка под шкафами -->
  <line x1="585" y1="316" x2="905" y2="316" stroke="#B99358" stroke-width="5" stroke-linecap="round"/>
  <!-- Столешница -->
  <line x1="517" y1="400" x2="1033" y2="400" stroke="#1A1A1A" stroke-width="4"/>
  <!-- Смеситель и мойка -->
  <path d="M598 398 V336 A17 17 0 0 1 632 336 L632 352"
        fill="none" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round"/>
  <rect x="576" y="388" width="56" height="12" rx="6" fill="#B99358"/>
  <!-- Чаша -->
  <path d="M962 396 A23 23 0 0 0 1008 396 Z" fill="none" stroke="#1A1A1A" stroke-width="3.5"/>
  <!-- Нижние секции -->
  <g stroke="#1A1A1A" stroke-width="4">
    <line x1="517" y1="400" x2="517" y2="543"/>
    <line x1="692" y1="400" x2="692" y2="543"/>
    <line x1="866" y1="400" x2="866" y2="543"/>
    <line x1="1033" y1="400" x2="1033" y2="543"/>
  </g>
  <!-- Ящики (золото) -->
  <g stroke="#B99358" stroke-width="5" stroke-linecap="round">
    <line x1="722" y1="455" x2="838" y2="455"/>
    <line x1="722" y1="492" x2="838" y2="492"/>
  </g>
  <!-- Ручки дверец (золото) -->
  <g stroke="#B99358" stroke-width="5" stroke-linecap="round">
    <line x1="930" y1="430" x2="930" y2="512"/>
    <line x1="975" y1="430" x2="975" y2="512"/>
  </g>

  <!-- ===== Текст ===== -->
  <text x="588" y="668" text-anchor="middle"
        font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="700"
        font-size="98" letter-spacing="10" fill="#1A1A1A">МОДУЛЬ ЭСТЕТ</text>
  <text x="588" y="752" text-anchor="middle"
        font-family="Montserrat, 'Segoe UI', Arial, sans-serif" font-weight="600"
        font-size="42" letter-spacing="14" fill="#B99358">КУХНИ НА ЗАКАЗ</text>
  <g stroke="#B99358" stroke-width="4" stroke-linecap="round">
    <line x1="138" y1="738" x2="300" y2="738"/>
    <line x1="876" y1="738" x2="1038" y2="738"/>
  </g>
</svg>
