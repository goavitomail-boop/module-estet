<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="Знак «Модуль Эстет» для светлых фонов">
  <!-- Прозрачный фон, тёмный знак — для светлых подложек -->
  <g fill="none" stroke="#1A1A1A" stroke-width="7">
    <path d="M29 65.5 L29 28.5 L48 50 L67 28.5 L67 65.5"/>
  </g>
  <!-- Фаски-зазоры совпадают с фоном: использовать только на сплошных светлых подложках -->
  <g stroke="#FFFFFF" stroke-width="3">
    <line x1="25.5" y1="47" x2="32.5" y2="47"/>
    <line x1="63.5" y1="47" x2="70.5" y2="47"/>
  </g>
  <g stroke="#B99358" stroke-width="3.5">
    <line x1="24" y1="76" x2="72" y2="76"/>
    <line x1="24" y1="72" x2="24" y2="80"/>
    <line x1="72" y1="72" x2="72" y2="80"/>
  </g>
</svg>
