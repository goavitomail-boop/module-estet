<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-label="«Модуль Эстет» — кухни на заказ">
  <!-- Универсальная версия на плашке: работает на любом фоне -->
  <rect width="96" height="96" rx="22" fill="#1A1A1A"/>
  <!-- «М», собранная из модулей: зазоры читаются как фасады шкафов -->
  <path d="M29 65.5 L29 28.5 L48 50 L67 28.5 L67 65.5"
        fill="none" stroke="#F8F5EF" stroke-width="7"/>
  <g stroke="#1A1A1A" stroke-width="3">
    <line x1="25.5" y1="47" x2="32.5" y2="47"/>
    <line x1="63.5" y1="47" x2="70.5" y2="47"/>
  </g>
  <!-- Золотая размерная линия: отсылка к чертежу и замеру -->
  <g stroke="#B99358" stroke-width="3.5">
    <line x1="24" y1="76" x2="72" y2="76"/>
    <line x1="24" y1="72" x2="24" y2="80"/>
    <line x1="72" y1="72" x2="72" y2="80"/>
  </g>
</svg>
