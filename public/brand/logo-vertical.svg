  </g>
  <text x="180" y="200" text-anchor="middle" class="title" fill="#1A1A1A">МОДУЛЬ <tspan fill="#B99358">ЭСТЕТ</tspan></text>
  <text x="180" y="236" text-anchor="middle" class="sub" fill="#8A8578">КУХНИ НА ЗАКАЗ · МОСКВА И МО</text>
