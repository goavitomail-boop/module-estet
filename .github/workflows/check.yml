name: Проверка кода

# Линтер и типы TypeScript на каждый push и pull request. На сервере сайт
# собирается без проверки типов: ей не хватает памяти (next.config.mjs),
# поэтому ошибки ловятся здесь — до выкатки. Красный крестик у коммита
# на GitHub = выкатывать рано.

on:
  push:
    branches: ['main', 'claude/**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Линтер
        run: pnpm lint
      - name: Типы TypeScript
        run: pnpm typecheck
